services:
  postgres:
    image: postgres:16-alpine
    container_name: strata-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: strata_dev
    volumes:
      - strata_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d strata_dev"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  strata_pgdata:
