services:
  postgres:
    image: postgres:16-alpine
    container_name: rex-postgres
    restart: unless-stopped
    ports:
      - "${POSTGRES_HOST_PORT:-5432}:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: rex
    volumes:
      - rex_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d rex"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  rex_pgdata:
